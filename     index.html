<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>StreetFind V3 TEST</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}header{padding:20px 16px;border-bottom:1px solid #222}.logo{font-size:28px;font-weight:900}.logo span{color:#777}.tag{color:#888;font-size:12px;margin-top:4px}main{max-width:1100px;margin:auto;padding:25px 15px 50px}.hero h1{font-size:clamp(40px,10vw,70px);line-height:.9;letter-spacing:-3px;margin:20px 0}.hero p{color:#999;line-height:1.5}.search{display:flex;gap:9px;margin:20px 0}.search input{flex:1;height:50px;padding:0 15px;border:1px solid #333;border-radius:12px;background:#151515;color:#fff;font-size:16px}.search button{height:50px;padding:0 18px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:900}.filters{display:flex;gap:8px;overflow:auto}.filter{padding:9px 14px;border:1px solid #333;border-radius:999px;background:#151515;color:#bbb}.filter.active{background:#fff;color:#000}.status{color:#888;margin:18px 0}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#111;border:1px solid #222;border-radius:15px;overflow:hidden}.image{aspect-ratio:1;background:#191919;display:flex;align-items:center;justify-content:center;color:#666}.image img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.brand{font-size:11px;color:#888;text-transform:uppercase}.name{margin-top:5px;font-weight:700;line-height:1.3}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}.price{font-weight:900}.buy{background:#222;color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:11px;font-weight:800}.empty{grid-column:1/-1;text-align:center;color:#777;padding:50px 15px}@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}@media(max-width:520px){.search{flex-direction:column}}
</style></head><body><header><div class="logo">STREETFIND<span> V3</span></div><div class="tag">Streetwear · Sneakers · Precios</div></header><main><section class="hero"><h1>ENCUENTRA<br>EL DRIP.</h1><p>Busca sneakers, ropa y accesorios streetwear y encuentra productos reales.</p></section><div class="search"><input id="q" type="search" placeholder="Busca Jordan, Nike, hoodie..."><button id="go">BUSCAR</button></div><div class="filters"><button class="filter active" data-c="all">Todo</button><button class="filter" data-c="sneakers">Zapatillas</button><button class="filter" data-c="clothing">Ropa</button><button class="filter" data-c="accessories">Accesorios</button></div><div class="status" id="status">Escribe algo para buscar productos reales.</div><section class="products" id="products"></section></main><script>
const API="https://streetfind-rose.vercel.app/api/search",q=document.getElementById("q"),go=document.getElementById("go"),box=document.getElementById("products"),status=document.getElementById("status");let cat="all";
const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function render(a){box.innerHTML="";if(!a.length){box.innerHTML='<div class="empty">No encontramos productos.</div>';return}a.forEach(p=>{let c=document.createElement("article");c.className="card";c.innerHTML='<div class="image">'+(p.thumbnail?'<img src="'+esc(p.thumbnail)+'" alt="'+esc(p.title)+'" loading="lazy">':"Sin imagen")+'</div><div class="info"><div class="brand">'+esc(p.source||"Tienda")+'</div><div class="name">'+esc(p.title||"Producto")+'</div><div class="bottom"><div class="price">'+esc(p.price||"Precio no disponible")+'</div><a class="buy" href="'+esc(p.product_link||"#")+'" target="_blank" rel="noopener">VER</a></div></div>';box.appendChild(c)})}
async function search(){let s=q.value.trim();if(!s){status.textContent="Escribe algo para buscar.";box.innerHTML="";return}status.textContent="Buscando productos reales...";box.innerHTML='<div class="empty">🔎 Buscando...</div>';try{let r=await fetch(API+"?q="+encodeURIComponent(s)),d=await r.json();if(!r.ok)throw Error(d.error||"Error");let a=d.shopping_results||[];if(cat!=="all")a=a.filter(p=>{let t=(p.title||"").toLowerCase();if(cat==="sneakers")return /shoe|sneaker|jordan|nike|adidas|air max/.test(t);if(cat==="clothing")return /hoodie|shirt|jacket|pants|t-shirt/.test(t);return /cap|bag|wallet|belt/.test(t)});status.textContent=a.length+" productos encontrados";render(a)}catch(e){status.textContent="Error conectando con StreetFind API.";box.innerHTML='<div class="empty">No se pudieron cargar los productos.<br><br>Inténtalo de nuevo.</div>'}}
go.onclick=search;q.addEventListener("keydown",e=>{if(e.key==="Enter")search()});document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");cat=b.dataset.c;if(q.value.trim())search()});
</script></body></html>
