<script>
/* =========================================================
   STREETFIND V4 — FEATURES PACK
   Se añade sobre el código existente.
========================================================= */

(function(){

"use strict";

/* =========================
   HELPERS
========================= */

function sfPrice(v){
  if(v==null)return null;

  const m=String(v).match(
    /(\d{1,5}(?:[.,]\d{1,2})?)/
  );

  if(!m)return null;

  let n=m[1];

  if(n.includes(",")&&n.includes(".")){
    n=n.lastIndexOf(",")>n.lastIndexOf(".")
      ?n.replace(/\./g,"").replace(",",".")
      :n.replace(/,/g,"");
  }else{
    n=n.replace(",",".");
  }

  const p=parseFloat(n);

  return Number.isFinite(p)?p:null;
}

function sfMoney(v){
  return Number(v).toFixed(2).replace(".",",")+" €";
}

function sfKey(p){
  return String(
    p?.product_link||
    p?.title||
    ""
  );
}

function sfScore(p,list){

  const price=sfPrice(p.price);

  if(price==null)return 50;

  const prices=list
    .map(x=>sfPrice(x.price))
    .filter(x=>x!=null);

  if(!prices.length)return 50;

  const min=Math.min(...prices);
  const max=Math.max(...prices);

  if(max===min)return 90;

  const priceScore=
    100-((price-min)/(max-min))*60;

  let score=Math.round(
    Math.max(0,Math.min(100,priceScore))
  );

  if(p.old_price){

    const old=sfPrice(p.old_price);

    if(old&&old>price){

      const discount=
        ((old-price)/old)*100;

      score+=Math.min(15,discount*.35);
    }
  }

  return Math.round(
    Math.max(0,Math.min(100,score))
  );
}

function sfSaving(p,list){

  const price=sfPrice(p.price);

  const prices=list
    .map(x=>sfPrice(x.price))
    .filter(x=>x!=null);

  if(price==null||prices.length<2)return null;

  const high=Math.max(...prices);

  if(high<=price)return null;

  return {
    amount:high-price,
    percent:((high-price)/high)*100
  };
}

/* =========================
   TOP OFFERS
========================= */

function renderTopOffers(list){

  let section=document.getElementById(
    "streetTopOffers"
  );

  if(!section){

    section=document.createElement("div");

    section.id="streetTopOffers";

    section.innerHTML=`
      <div class="section-title">
        <h2>🔥 Top ofertas</h2>
        <span>Las mejores oportunidades</span>
      </div>

      <div class="top-offers" id="streetTopOffersList"></div>
    `;

    const featured=document.getElementById(
      "featuredSection"
    );

    featured.insertBefore(
      section,
      featured.firstChild
    );
  }

  const container=document.getElementById(
    "streetTopOffersList"
  );

  const usable=list
    .filter(p=>sfPrice(p.price)!=null)
    .sort((a,b)=>sfPrice(a.price)-sfPrice(b.price))
    .slice(0,3);

  container.innerHTML="";

  usable.forEach((p,i)=>{

    const saving=sfSaving(p,list);

    const el=document.createElement("button");

    el.type="button";
    el.className=
      "top-offer"+
      (i===0?" first":"");

    el.innerHTML=`
      <div class="top-rank">
        ${i===0?"🥇":i===1?"🥈":"🥉"}
      </div>

      <div>
        <div class="top-offer-title">
          ${esc(p.title||"Producto")}
        </div>

        ${
          saving
            ?`
              <div class="top-offer-saving">
                Ahorras ${sfMoney(saving.amount)}
              </div>
            `
            :""
        }
      </div>

      <div class="top-offer-price">
        ${esc(p.price||"—")}
      </div>
    `;

    el.onclick=()=>openStreetProduct(p,list);

    container.appendChild(el);
  });
}

/* =========================
   SCORE + SAVING
========================= */

function injectScore(p,list){

  const score=sfScore(p,list);

  return `
    <div class="street-score">

      <div>
        <div class="street-score-main">
          🔥 <span>${score}/100</span>
        </div>

        <div class="street-score-label">
          StreetFind Score
        </div>
      </div>

      <div class="street-score-label">
        ${
          score>=90
            ?"Oferta excelente"
            :score>=75
              ?"Muy buena oferta"
              :score>=60
                ?"Buena oferta"
                :"Precio normal"
        }
      </div>

    </div>
  `;
}

/* =========================
   AUTOCOMPLETE
========================= */

const searchBox=document.querySelector(".search-box");

if(searchBox&&!document.getElementById("streetAutocomplete")){

  const ac=document.createElement("div");

  ac.id="streetAutocomplete";
  ac.className="autocomplete";

  searchBox.appendChild(ac);

  const suggestions=[
    "Jordan 4 Retro",
    "Jordan 4 Military Black",
    "Jordan 4 White Cement",
    "Nike Air Force 1",
    "Nike Dunk Low",
    "Nike Air Max 1",
    "Adidas Samba",
    "Adidas Campus",
    "New Balance 550",
    "New Balance 9060",
    "hoodie streetwear",
    "cargo pants",
    "streetwear t-shirt"
  ];

  q.addEventListener("input",()=>{

    const term=q.value.trim().toLowerCase();

    if(!term){
      ac.classList.remove("show");
      return;
    }

    const matches=suggestions
      .filter(x=>x.toLowerCase().includes(term))
      .slice(0,5);

    ac.innerHTML="";

    matches.forEach(text=>{

      const b=document.createElement("button");

      b.type="button";
      b.className="autocomplete-item";
      b.innerHTML=`🔎 ${esc(text)}`;

      b.onclick=()=>{

        q.value=text;
        clearSearch.classList.add("show");
        ac.classList.remove("show");
        search();

      };

      ac.appendChild(b);
    });

    ac.classList.toggle(
      "show",
      matches.length>0
    );

  });

  document.addEventListener("click",e=>{

    if(!searchBox.contains(e.target))
      ac.classList.remove("show");

  });
}

/* =========================
   STORE FILTERS
========================= */

const resultsSectionEl=
  document.getElementById("resultsSection");

if(resultsSectionEl&&!document.getElementById("streetStoreFilters")){

  const wrap=document.createElement("div");

  wrap.id="streetStoreFilters";
  wrap.className="store-filters";

  wrap.innerHTML=`
    <button class="store-filter active" data-store="all">
      Todas las tiendas
    </button>

    <button class="store-filter" data-store="Nike">
      Nike
    </button>

    <button class="store-filter" data-store="Adidas">
      Adidas
    </button>

    <button class="store-filter" data-store="JD">
      JD
    </button>

    <button class="store-filter" data-store="Foot Locker">
      Foot Locker
    </button>

    <button class="store-filter" data-store="StockX">
      StockX
    </button>
  `;

  const tools=resultsSectionEl.querySelector(
    ".results-tools"
  );

  tools.after(wrap);

  wrap.querySelectorAll(".store-filter")
    .forEach(btn=>{

      btn.onclick=()=>{

        wrap.querySelectorAll(
          ".store-filter"
        ).forEach(x=>
          x.classList.remove("active")
        );

        btn.classList.add("active");

        const store=btn.dataset.store;

        let list=[...lastResults];

        if(store!=="all"){

          list=list.filter(p=>
            String(p.source||"")
              .toLowerCase()
              .includes(store.toLowerCase())
          );
        }

        renderResults(list);
      };

    });
}

/* =========================
   SORT — MAYOR AHORRO
========================= */

const sortTools=document.querySelector(
  ".results-tools"
);

if(sortTools&&!sortTools.querySelector(
  '[data-sort="saving"]'
)){

  const b=document.createElement("button");

  b.className="sort-btn";
  b.dataset.sort="saving";
  b.type="button";
  b.textContent="Mayor ahorro";

  sortTools.appendChild(b);

  b.onclick=()=>{

    sortTools.querySelectorAll(
      ".sort-btn"
    ).forEach(x=>
      x.classList.remove("active")
    );

    b.classList.add("active");

    sortMode="saving";

    if(lastResults.length)
      renderResults(lastResults);
  };
}

/* =========================
   PRODUCT MODAL
========================= */

function ensureModal(){

  if(document.getElementById(
    "streetProductModal"
  ))return;

  const modal=document.createElement("div");

  modal.id="streetProductModal";
  modal.className="product-modal";

  modal.innerHTML=`
    <button
      class="product-modal-close"
      id="streetProductClose">
      ×
    </button>

    <div class="product-modal-card">

      <div
        id="streetProductImage"
        class="product-modal-image">
      </div>

      <div class="product-modal-info">

        <div
          id="streetProductBrand"
          class="product-modal-brand">
        </div>

        <div
          id="streetProductTitle"
          class="product-modal-title">
        </div>

        <div
          id="streetProductPrice"
          class="product-modal-price">
        </div>

        <div
          id="streetProductSaving"
          class="product-modal-saving">
        </div>

        <div id="streetProductScore"></div>

        <div
          id="streetProductHistory"
          class="history-box">
        </div>

        <div class="product-modal-actions">

          <button
            id="streetProductFav"
            class="product-modal-btn">
            ♡ Favorito
          </button>

          <button
            id="streetProductAlert"
            class="product-modal-btn">
            🔔 Crear alerta
          </button>

          <a
            id="streetProductBuy"
            class="product-modal-btn primary"
            style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;text-decoration:none"
            target="_blank"
            rel="noopener noreferrer">
            VER OFERTA
          </a>

        </div>

      </div>
    </div>
  `;

  document.body.appendChild(modal);

  document.getElementById(
    "streetProductClose"
  ).onclick=closeStreetProduct;

  modal.addEventListener("click",e=>{

    if(e.target===modal)
      closeStreetProduct();

  });
}

let streetModalProduct=null;
let streetModalList=[];

function openStreetProduct(p,list=[]){

  ensureModal();

  streetModalProduct=p;
  streetModalList=list;

  const modal=document.getElementById(
    "streetProductModal"
  );

  const image=document.getElementById(
    "streetProductImage"
  );

  image.innerHTML=p.thumbnail
    ?`
      <img
        src="${esc(p.thumbnail)}"
        alt="${esc(p.title||"Producto")}">
    `
    :`
      <div class="image-fallback">
        Sin imagen
      </div>
    `;

  document.getElementById(
    "streetProductBrand"
  ).textContent=p.source||"Tienda";

  document.getElementById(
    "streetProductTitle"
  ).textContent=p.title||"Producto";

  document.getElementById(
    "streetProductPrice"
  ).textContent=p.price||"Precio no disponible";

  const saving=sfSaving(p,list);

  document.getElementById(
    "streetProductSaving"
  ).textContent=saving
    ?`Ahorras ${sfMoney(saving.amount)} · ${saving.percent.toFixed(0)}%`
    :"";

  document.getElementById(
    "streetProductScore"
  ).innerHTML=
    injectScore(p,list);

  document.getElementById(
    "streetProductBuy"
  ).href=getProductUrl(p);

  document.getElementById(
    "streetProductFav"
  ).textContent=
    isFavorite(p)
      ?"♥ Favorito"
      :"♡ Favorito";

  document.getElementById(
    "streetProductFav"
  ).onclick=()=>{

    toggleFavorite(p);

    document.getElementById(
      "streetProductFav"
    ).textContent=
      isFavorite(p)
        ?"♥ Favorito"
        :"♡ Favorito";
  };

  document.getElementById(
    "streetProductAlert"
  ).onclick=()=>{

    closeStreetProduct();
    openAlert(p);

  };

  renderStreetHistory(p,list);

  modal.classList.add("show");

}

function closeStreetProduct(){

  const modal=document.getElementById(
    "streetProductModal"
  );

  if(modal)
    modal.classList.remove("show");

  streetModalProduct=null;
}

function renderStreetHistory(p,list){

  const el=document.getElementById(
    "streetProductHistory"
  );

  if(!el)return;

  const prices=list
    .map(x=>sfPrice(x.price))
    .filter(x=>x!=null);

  if(!prices.length){

    el.innerHTML=`
      <div class="history-title">
        📉 Historial de precios
      </div>

      <div style="margin-top:8px;color:#666;font-size:10px">
        Todavía no hay suficientes datos.
      </div>
    `;

    return;
  }

  const min=Math.min(...prices);
  const max=Math.max(...prices);

  const bars=prices
    .slice(0,10)
    .map(price=>{

      const height=max===min
        ?55
        :20+((price-min)/(max-min))*45;

      return `
        <div
          class="history-bar ${
            price===sfPrice(p.price)
              ?"history-current"
              :""
          }"
          style="height:${height}%">
        </div>
      `;
    })
    .join("");

  el.innerHTML=`
    <div class="history-title">
      📉 Comparación de precios
    </div>

    <div class="history-line">
      ${bars}
    </div>

    <div style="display:flex;justify-content:space-between;margin-top:7px;color:#666;font-size:9px">
      <span>Más barato ${sfMoney(min)}</span>
      <span>Más caro ${sfMoney(max)}</span>
    </div>
  `;
}

/* =========================
   ABRIR PRODUCTO AL TOCAR
========================= */

document.addEventListener("click",e=>{

  const card=e.target.closest(".card");

  if(!card)return;

  if(
    e.target.closest(
      "button,a,.favorite,.share"
    )
  )return;

  const fav=card.querySelector(
    ".favorite"
  );

  if(!fav)return;

  try{

    const p=JSON.parse(
      decodeURIComponent(
        fav.dataset.product
      )
    );

    openStreetProduct(
      p,
      lastResults.length
        ?lastResults
        :favorites
    );

  }catch(err){}

});

/* =========================
   REEMPLAZAR PRODUCT RENDER
========================= */

const originalProductHTML=
  window.productHTML;

window.productHTML=function(
  p,
  best=false,
  saving=null
){

  const html=originalProductHTML
    ?originalProductHTML(
      p,
      best,
      saving
    )
    :"";

  return html.replace(
    "</div>\n\n        ${storeInfo",
    "</div>"
  );
};

/* =========================
   SCORE EN TARJETAS
========================= */

const originalRenderResults=
  window.renderResults;

window.renderResults=function(list){

  if(
    typeof originalRenderResults===
    "function"
  ){

    originalRenderResults(list);

    setTimeout(()=>{

      document.querySelectorAll(
        "#products .card"
      ).forEach(card=>{

        const fav=card.querySelector(
          ".favorite"
        );

        if(!fav)return;

        try{

          const p=JSON.parse(
            decodeURIComponent(
              fav.dataset.product
            )
          );

          const info=card.querySelector(
            ".info"
          );

          if(
            info&&
            !info.querySelector(
              ".street-score"
            )
          ){

            info.insertAdjacentHTML(
              "beforeend",
              injectScore(
                p,
                list
              )
            );
          }

        }catch(e){}

      });

    },0);
  }
};

/* =========================
   SCORE EN DESTACADOS
========================= */

const originalRenderFeatured=
  window.renderFeatured;

window.renderFeatured=function(list){

  if(
    typeof originalRenderFeatured===
    "function"
  ){

    originalRenderFeatured(list);

    renderTopOffers(list);

    setTimeout(()=>{

      document.querySelectorAll(
        "#featuredProducts .card"
      ).forEach(card=>{

        const fav=card.querySelector(
          ".favorite"
        );

        if(!fav)return;

        try{

          const p=JSON.parse(
            decodeURIComponent(
              fav.dataset.product
            )
          );

          const info=card.querySelector(
            ".info"
          );

          if(info){

            info.insertAdjacentHTML(
              "beforeend",
              injectScore(p,list)
            );
          }

        }catch(e){}

      });

    },0);
  }
};

function updateFavoriteSummary(){

  const total=document.getElementById(
    "streetFavTotal"
  );

  const drops=document.getElementById(
    "streetFavDrops"
  );

  if(total)
    total.textContent=favorites.length;

  if(drops){

    let count=0;

    favorites.forEach(p=>{

      const current=sfPrice(p.price);
      const old=sfPrice(p.old_price);

      if(
        current!=null&&
        old!=null&&
        current<old
      )count++;
    });

    drops.textContent=count;
  }
}

const oldRenderFavorites=
  window.renderFavorites;

window.renderFavorites=function(){

  if(
    typeof oldRenderFavorites===
    "function"
  )
    oldRenderFavorites();

  setTimeout(updateFavoriteSummary,0);
};

/* =========================
   ALERTAS MEJORADAS
========================= */

const oldRenderAlerts=
  window.renderAlerts;

window.renderAlerts=function(){

  if(
    typeof oldRenderAlerts===
    "function"
  )
    oldRenderAlerts();

  setTimeout(()=>{

    document.querySelectorAll(
      "#alertList .alert-item"
    ).forEach((item,i)=>{

      const alert=alerts[i];

      if(!alert)return;

      const current=
        sfPrice(alert.product.price);

      const target=
        Number(alert.target);

      if(
        current!=null&&
        target>0
      ){

        if(current<=target){

          item.insertAdjacentHTML(
            "afterbegin",
            `
              <div class="alert-reached">
                🟢 ¡PRECIO ALCANZADO!
              </div>
            `
          );

        }else{

          const progress=
            Math.max(
              0,
              Math.min(
                100,
                (1-current/(target*1.5))*100
              )
            );

          item.insertAdjacentHTML(
            "beforeend",
            `
              <div class="alert-progress">
                <div style="width:${progress}%"></div>
              </div>

              <div style="margin-top:6px;color:#666;font-size:9px">
                Actual: ${sfMoney(current)}
                · Faltan ${sfMoney(current-target)}
              </div>
            `
          );
        }
      }

    });

  },0);
};

/* =========================
   CORREGIR ORDEN POR AHORRO
========================= */

const originalSortByPrice=
  window.sortByPrice;

window.sortByPrice=function(list){

  if(
    typeof sortMode!=="undefined"&&
    sortMode==="saving"
  ){

    return [...list].sort((a,b)=>{

      const sa=sfSaving(a,list);
      const sb=sfSaving(b,list);

      return (
        (sb?.amount||0)-
        (sa?.amount||0)
      );
    });
  }

  return originalSortByPrice(list);
};
